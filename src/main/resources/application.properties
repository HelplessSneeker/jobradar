spring.application.name=jobradar
spring.config.import=optional:file:.env[.properties]

deepseek.api-key=${DEEPSEEK_API_KEY}

# In Boot 4 heisst es spring.http.clients.*, spring.http.client.* ist veraltet.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=60s

# USD pro 1 Mio. Tokens, deepseek-flash ausserhalb der Spitzenzeit
deepseek.price.input=0.15
deepseek.price.cache-hit=0.003
deepseek.price.output=0.60
